[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inventory-replenishment-agent"
version = "0.1.0"
description = "Automated inventory replenishment agent with predictive demand, supplier selection, and human-in-the-loop escalation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.2.0",
    "llama-index>=0.11.0",
    "llama-index-embeddings-huggingface>=0.3.0",
    "llama-index-vector-stores-chroma>=0.2.0",
    "chromadb>=0.5.0",
    "qdrant-client>=1.10.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "tiktoken>=0.7.0",
    "cryptography>=42.0.0",
    "slowapi>=0.1.9",
    "mcp>=1.0.0",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pre-commit>=3.8.0",
]
eval = [
    "ragas>=0.2.0",
    "deepeval>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["tests/", "scripts/", "evals/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require external API keys",
    "e2e: marks end-to-end browser tests",
]
