app:
  name: inventory-replenishment-agent
  version: 0.1.0
  env: development

llm:
  default_model: gemini-1.5-flash
  temperature: 0.0
  max_tokens: 4096

context:
  target_context_tokens: 8000

retrieval:
  top_k: 5
  similarity_cutoff: 0.7

graph:
  max_iterations: 10
  human_in_the_loop: true

inventory:
  default_lead_time_days: 14
  safety_stock_multiplier: 1.5
  eoq_holding_cost_rate: 0.25
  eoq_order_cost: 50.0

escalation:
  order_value_threshold: 10000.0
  risk_score_threshold: 0.7

audit:
  default_interval_minutes: 60
  enable_scheduled_audits: false

mcp:
  # Enable MCP servers from the Anthropic registry.
  # Deterministic nodes (stock_monitor, demand_forecast) use DatabaseClient
  # directly. MCP tools are available to the LLM agent and for Slack
  # escalation notifications.
  enabled: false
  servers:
    postgres:
      transport: stdio
      command: npx
      args: ["-y", "@anthropic/mcp-server-postgres"]
      env:
        DATABASE_URL: "${DATABASE_URL}"
    slack:
      transport: stdio
      command: npx
      args: ["-y", "@anthropic/mcp-server-slack"]
      env:
        SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
        SLACK_TEAM_ID: "${SLACK_TEAM_ID}"
